name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select Linux compiler
        if: runner.os == 'Linux'
        run: |
          clang-15 --version
          echo "CC=clang-15" >> "$GITHUB_ENV"
          echo "CXX=clang++-15" >> "$GITHUB_ENV"
      - name: Install dependencies and rebuild native addons
        run: npm ci --no-audit --no-fund
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:verify
      - name: Lint, types, tests and production build
        run: npm run check
      - name: Package application
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Packaged offline smoke test
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Packaged offline smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          xvfb-run -a npm run test:packaged
      - name: Upload tested installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  publish:
    name: Publish preview release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Verify version and generate SHA-256 checksums
        run: |
          npm run release:verify
          npm run release:checksums
      - name: Publish tested preview assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.exe release/*.dmg release/*.AppImage release/SHA256SUMS.txt
          --verify-tag --prerelease
          --title "RemoteHub Desktop $GITHUB_REF_NAME"
          --notes-file docs/RELEASE_NOTES.md
